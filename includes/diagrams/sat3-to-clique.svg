<line x1="100" y1="120" x2="260" y2="50" stroke-width="1.2"/>
<line x1="100" y1="120" x2="260" y2="120" stroke-width="1.2"/>
<line x1="100" y1="120" x2="260" y2="190" stroke-width="1.2"/>
