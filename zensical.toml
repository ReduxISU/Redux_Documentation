[project]
site_name = "Redux Documentation"
site_description = "Documentation for Humans and Machines on the Redux Project"
site_author = "Idaho State University Redux"
site_url = "https://reduxisu.github.io/Redux_Documentation/"
repo_url = "https://github.com/ReduxISU/Redux_Documentation"
repo_name = "ReduxISU/Redux_Documentation"
edit_uri = "edit/main/docs/"
copyright = "Copyright &copy; 2026 Idaho State University Redux · BSD 3-Clause"
docs_dir = "docs"
site_dir = "site"
dev_addr = "localhost:27300"
watch = ["includes", "templates"]

nav = [
  "index.md",
  { "Use Redux" = [
    "use/index.md",
    "use/first-session.md",
    "use/workbench.md",
    "use/instances.md",
    "use/visualize.md",
    "use/reduce.md",
    "use/limits.md",
    "use/teaching.md",
  ] },
  { "Learn" = [
    "learn/problems-and-instances.md",
    "learn/complexity-classes.md",
    "learn/solving-and-verifying.md",
    "learn/reductions.md",
    "learn/visualizations.md",
  ] },
  { "Contribute" = [
    "contribute/index.md",
    { "Repositories" = [
      "contribute/redux-documentation.md",
    ] },
  ] },
  { "Reference" = [
    "reference/api.md",
    "reference/errors.md",
    "reference/glossary.md",
  ] },
]

[project.theme]
language = "en"
features = [
  "content.action.edit",
  "content.action.view",
  "content.code.annotate",
  "content.code.copy",
  "content.tabs.link",
  "content.tooltips",
  "navigation.footer",
  "navigation.indexes",
  "navigation.instant",
  "navigation.path",
  "navigation.sections",
  "navigation.tabs",
  "navigation.top",
  "navigation.tracking",
  "search.highlight",
  "toc.follow",
]

[project.theme.icon]
repo = "fontawesome/brands/github"

[[project.theme.palette]]
media = "(prefers-color-scheme)"
toggle.icon = "lucide/sun-moon"
toggle.name = "Switch to light mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
toggle.icon = "lucide/moon"
toggle.name = "Switch to system preference"

[[project.extra.social]]
icon = "fontawesome/brands/github"
link = "https://github.com/ReduxISU"
name = "ReduxISU on GitHub"

[[project.extra.social]]
icon = "fontawesome/brands/discord"
link = "https://discord.gg/sEC3rTXn2Z"
name = "Redux on Discord"

[project.markdown_extensions]
abbr = {}
admonition = {}
attr_list = {}
def_list = {}
footnotes = {}
md_in_html = {}
toc.permalink = true
pymdownx.betterem = {}
pymdownx.caret = {}
pymdownx.details = {}
pymdownx.emoji.emoji_generator = "zensical.extensions.emoji.to_svg"
pymdownx.emoji.emoji_index = "zensical.extensions.emoji.twemoji"
pymdownx.highlight.anchor_linenums = true
pymdownx.highlight.line_spans = "__span"
pymdownx.highlight.pygments_lang_class = true
pymdownx.inlinehilite = {}
pymdownx.keys = {}
pymdownx.mark = {}
pymdownx.smartsymbols = {}
pymdownx.snippets.base_path = ["."]
pymdownx.snippets.check_paths = true
pymdownx.snippets.auto_append = ["includes/links.md"]
pymdownx.superfences.custom_fences = [
  { name = "mermaid", class = "mermaid", format = "pymdownx.superfences.fence_code_format" },
]
pymdownx.tabbed.alternate_style = true
pymdownx.tabbed.combine_header_slug = true
pymdownx.tasklist.custom_checkbox = true
pymdownx.tilde = {}
