<rect x="20" y="36" width="80" height="28" rx="6" stroke-width="1.5"/>
<rect x="20" y="106" width="80" height="28" rx="6" stroke-width="1.5"/>
<rect x="20" y="176" width="80" height="28" rx="6" stroke-width="1.5"/>
<rect x="260" y="36" width="80" height="28" rx="6" stroke-width="1.5"/>
